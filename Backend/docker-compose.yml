version: '3.8'

services:
  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"      # MinIO API port
      - "9001:9001"      # MinIO Console (Web UI)
    environment:
      MINIO_ROOT_USER: hackract_admin
      MINIO_ROOT_PASSWORD: hackract_secret_123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - hackract
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  minio_data:
    driver: local

networks:
  hackract:
    driver: bridge
